/* =========================================================
   拖曳 (日計劃時段)
========================================================= */
function initDayDrag(){
  var blocks = document.querySelectorAll('.day-block');
  blocks.forEach(function(block){
    block.addEventListener('pointerdown', function(ev){
      if(ev.target.closest('.db-copy') || ev.target.closest('.done-check')) return;
      ev.preventDefault();
      var hh = getHourHeight();
      dragInfo = {
        block: block,
        taskId: block.getAttribute('data-task-id'),
        startY: ev.clientY,
        originalTop: parseFloat(block.style.top),
        duration: Number(block.getAttribute('data-duration')),
        hh: hh,
        moved: false
      };
      block.classList.add('dragging');
      block.setPointerCapture(ev.pointerId);
    });
    block.addEventListener('pointermove', function(ev){
      if(!dragInfo || dragInfo.block!==block) return;
      var deltaY = ev.clientY - dragInfo.startY;
      if(Math.abs(deltaY)>4) dragInfo.moved = true;
      var newTop = dragInfo.originalTop + deltaY;
      var maxTop = 24*dragInfo.hh - (dragInfo.duration/60*dragInfo.hh);
      if(newTop<0) newTop=0;
      if(newTop>maxTop) newTop=maxTop;
      block.style.top = newTop+'px';
    });
    block.addEventListener('pointerup', function(ev){
      if(!dragInfo || dragInfo.block!==block) return;
      block.classList.remove('dragging');
      var info = dragInfo; dragInfo = null;
      if(!info.moved){
        openTaskModal({ taskId: info.taskId, occDate: toISODate(cursorDate) });
        return;
      }
      var topPx = parseFloat(block.style.top);
      var rawStartMin = topPx/info.hh*60;
      var snapped = Math.round(rawStartMin/15)*15;
      var newStart = timeFromMinutes(snapped);
      var newEnd = timeFromMinutes(snapped+info.duration);
      var task = state.tasks.find(function(t){ return t.id===info.taskId; });
      if(!task) { render(); return; }
      function applyChange(){
        task.startTime = newStart; task.endTime = newEnd;
        saveState(); render();
        showToast('已更新時間為 '+newStart+' - '+newEnd);
      }
      if(task.repeat!=='none'){
        openConfirm('此任務會重複發生，調整時間將套用到「所有重複日期」，確定要調整嗎？', applyChange);
        // revert visual if user cancels -> handled by re-render on cancel too
        var cancelBtn = document.getElementById('confirmCancel');
        var onCancelOnce = function(){ render(); cancelBtn.removeEventListener('click', onCancelOnce); };
        cancelBtn.addEventListener('click', onCancelOnce);
      } else {
        applyChange();
      }
    });
  });
}

/* =========================================================
   拖曳排序（儀表板：今天要做的事）
========================================================= */
var rowDrag = null;
function initDashboardDrag(){
  var body = document.getElementById('dashBody');
  if(!body) return;
  body.querySelectorAll('.drag-handle').forEach(function(handle){
    handle.addEventListener('pointerdown', function(ev){
      if(ev.pointerType==='mouse' && ev.button!==0) return;
      var row = handle.closest('tr');
      var s = { row:row, handle:handle, pointerId:ev.pointerId, type:ev.pointerType, startY:ev.clientY, active:false, timer:null };
      rowDrag = s;
      if(ev.pointerType==='mouse'){
        ev.preventDefault();
      } else {
        row.classList.add('row-armed');
        s.timer = setTimeout(function(){
          if(rowDrag===s){ s.active=true; row.classList.remove('row-armed'); row.classList.add('row-dragging'); if(navigator.vibrate){ try{navigator.vibrate(15);}catch(e){} } }
        }, 250);
      }
    });
  });
}
/* 移動中整列會被搬動位置，所以 move / up 改在 document 上監聽，才不會因為搬動而中斷 */
function dashRowMove(ev){
  var s = rowDrag;
  if(!s || ev.pointerId!==s.pointerId) return;
  if(!s.active){
    if(s.type==='mouse' && Math.abs(ev.clientY-s.startY)>4){ s.active=true; s.row.classList.add('row-dragging'); }
    else if(s.type!=='mouse' && Math.abs(ev.clientY-s.startY)>10 && s.timer){ clearTimeout(s.timer); s.timer=null; s.row.classList.remove('row-armed'); rowDrag=null; return; }
    else return;
  }
  ev.preventDefault();
  var body = document.getElementById('dashBody');
  if(!body) return;
  var rows = Array.prototype.slice.call(body.querySelectorAll('tr'));
  var y = ev.clientY, placed=false;
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    if(r===s.row) continue;
    var rect = r.getBoundingClientRect();
    if(y < rect.top + rect.height/2){
      if(r.previousElementSibling!==s.row) body.insertBefore(s.row, r);
      placed=true; break;
    }
  }
  if(!placed && body.lastElementChild!==s.row) body.appendChild(s.row);
}
function dashRowEnd(ev, cancelled){
  var s = rowDrag;
  if(!s || ev.pointerId!==s.pointerId) return;
  rowDrag = null;
  if(s.timer) clearTimeout(s.timer);
  s.row.classList.remove('row-armed','row-dragging');
  var body = document.getElementById('dashBody');
  if(s.active && !cancelled && body) commitDashboardOrder(body);
  else if(s.active) render();
}
function commitDashboardOrder(body){
  var rows = Array.prototype.slice.call(body.querySelectorAll('tr'));
  var lastTimed = -1, movedIds = [];
  rows.forEach(function(r){
    var id = r.getAttribute('data-row-id');
    if(r.getAttribute('data-allday')==='1'){
      var t = state.tasks.find(function(x){ return x.id===id; });
      if(t) t.sortMinute = lastTimed;
      movedIds.push(id);
    } else {
      lastTimed = Number(r.getAttribute('data-start-min'));
    }
  });
  // 把今天這幾件沒填時間的事，依新順序放回整體順序中
  state.tasks.forEach(function(t){ if(state.sortOrder.indexOf(t.id)===-1) state.sortOrder.push(t.id); });
  var firstPos = Math.min.apply(null, movedIds.map(function(id){ return state.sortOrder.indexOf(id); }));
  var rest = state.sortOrder.filter(function(id){ return movedIds.indexOf(id)===-1; });
  var insertAt = 0;
  for(var i=0;i<firstPos;i++){ if(movedIds.indexOf(state.sortOrder[i])===-1) insertAt++; }
  state.sortOrder = rest.slice(0,insertAt).concat(movedIds, rest.slice(insertAt));
  saveState();
  render();
  showToast('已更新順序');
}

/* =========================================================
   事件綁定（動態內容區域）
========================================================= */
function bindDynamicEvents(){
  // copy buttons
  document.querySelectorAll('[data-copy]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var id = el.getAttribute('data-copy');
      var t = state.tasks.find(function(x){ return x.id===id; });
      if(t) copyContent(t.content);
    });
  });
  // edit triggers
  document.querySelectorAll('[data-edit]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      openTaskModal({ taskId: el.getAttribute('data-edit'), occDate: el.getAttribute('data-occ-date') });
    });
  });
  document.querySelectorAll('[data-edit-stop]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      openTaskModal({ taskId: el.getAttribute('data-edit-stop'), occDate: el.getAttribute('data-occ-date') });
    });
  });
  // delete
  document.querySelectorAll('[data-delete]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var id = el.getAttribute('data-delete');
      requestDelete(id, el.getAttribute('data-occ-date'));
    });
  });
  // done toggle（點方框不要觸發外層的「編輯」或「跳到某天」）
  document.querySelectorAll('[data-toggle-done]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.stopPropagation(); });
    el.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); });
  });
  document.querySelectorAll('[data-toggle-done]').forEach(function(el){
    el.addEventListener('change', function(){
      toggleCompleted(el.getAttribute('data-toggle-done'), el.getAttribute('data-date'));
      render();
    });
  });
  // goto day
  document.querySelectorAll('[data-goto-day]').forEach(function(el){
    el.addEventListener('click', function(ev){
      if(ev.target.closest('[data-edit-stop]')) return;
      cursorDate = parseISODate(el.getAttribute('data-goto-day'));
      switchView('day');
    });
  });
  document.querySelectorAll('[data-goto-week]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      cursorDate = parseISODate(el.getAttribute('data-goto-week'));
      linkedWeekStart = toISODate(startOfWeek(cursorDate));
      switchView('week');
    });
  });
  document.querySelectorAll('[data-day-outline]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      openDayOutline(el.getAttribute('data-day-outline'));
    });
  });
  document.querySelectorAll('[data-goto-month]').forEach(function(el){
    el.addEventListener('click', function(){
      cursorDate = new Date(cursorDate.getFullYear(), Number(el.getAttribute('data-goto-month')), 1);
      switchView('month');
    });
  });

  if(currentView==='day') initDayDrag();
  if(currentView==='dashboard') initDashboardDrag();

  if(currentView==='list'){
    document.getElementById('listSearch').addEventListener('input', function(e){
      listState.search = e.target.value; render();
    });
    document.getElementById('listCategoryFilter').addEventListener('change', function(e){
      listState.category = e.target.value; render();
    });
    document.querySelectorAll('.range-btns button').forEach(function(btn){
      btn.addEventListener('click', function(){
        listState.range = btn.getAttribute('data-range'); render();
      });
    });
  }

  if(currentView==='week'){
    document.querySelectorAll('[data-week-layout]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.settings.weekLayout = btn.getAttribute('data-week-layout');
        saveState(); render();
      });
    });
  }

  if(currentView==='year'){
    document.querySelectorAll('[data-year-mode]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.settings.yearViewMode = btn.getAttribute('data-year-mode');
        saveState(); render();
      });
    });
    document.querySelectorAll('[data-month-note-key]').forEach(function(ta){
      ta.addEventListener('input', function(){
        if(!state.monthNotes) state.monthNotes = {};
        state.monthNotes[ta.getAttribute('data-month-note-key')] = ta.value;
        saveState();
      });
    });
  }

  if(currentView==='settings') bindSettingsEvents();
}

function bindSettingsEvents(){
  document.querySelectorAll('[data-delete-cat]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-delete-cat');
      if(state.categories.length<=1){ showToast('至少需保留一個分類'); return; }
      var inUse = state.tasks.some(function(t){ return t.categoryId===id; });
      var msg = inUse ? '此分類仍有任務使用中，刪除後這些任務將改為「未分類」，確定要刪除嗎？' : '確定要刪除這個分類嗎？';
      openConfirm(msg, function(){
        state.categories = state.categories.filter(function(c){ return c.id!==id; });
        saveState(); render(); showToast('已刪除分類');
      });
    });
  });
  var settingsColorSelect = document.getElementById('settingsNewCatColorSelect');
  settingsColorSelect.addEventListener('change', function(){
    document.getElementById('settingsNewCatColorPreview').style.background = colorBase(settingsColorSelect.value);
  });
  document.getElementById('btnSettingsAddCat').addEventListener('click', function(){
    var name = document.getElementById('settingsNewCatName').value.trim();
    if(!name){ showToast('請輸入分類名稱'); return; }
    var color = settingsColorSelect.value;
    state.categories.push({ id:'cat'+Date.now(), name:name, color:color });
    saveState(); render(); showToast('已新增分類');
  });

  document.getElementById('setReminderToggle').addEventListener('change', function(e){
    state.settings.reminderEnabled = e.target.checked;
    if(e.target.checked && 'Notification' in window && Notification.permission==='default'){
      Notification.requestPermission();
    }
    saveState();
  });
  document.getElementById('setReminderTime').addEventListener('change', function(e){
    state.settings.reminderTime = e.target.value; saveState();
  });

  document.getElementById('btnExport').addEventListener('click', exportBackup);
  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('btnResetAll').addEventListener('click', function(){
    openConfirm('這將刪除所有任務與自訂分類，且無法復原，確定要繼續嗎？', function(){
      state.categories = DEFAULT_CATEGORIES.slice();
      state.tasks = [];
      state.completions = {};
      state.sortOrder = [];
      saveState(); render(); showToast('已清空所有資料');
    });
  });
}

/* =========================================================
   匯出 / 匯入
========================================================= */
function exportBackup(){
  var data = JSON.stringify(state, null, 2);
  var blob = new Blob([data], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '規劃小幫手備份_'+todayISO()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔');
}
function importBackup(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.tasks)){ showToast('檔案格式不正確'); return; }
      openConfirm('匯入將覆蓋目前所有資料，確定要繼續嗎？', function(){
        state.categories = parsed.categories && parsed.categories.length ? parsed.categories : DEFAULT_CATEGORIES.slice();
        state.tasks = parsed.tasks || [];
        state.completions = parsed.completions || {};
        state.monthNotes = parsed.monthNotes || {};
        state.sortOrder = parsed.sortOrder || [];
        state.settings = Object.assign({reminderEnabled:false, reminderTime:'20:00', lastReminderDate:null, navOrder:DEFAULT_NAV_ORDER.slice(), weekLayout:'scroll', yearViewMode:'full'}, parsed.settings||{});
        state.settings.navOrder = normalizeNavOrder(state.settings.navOrder);
        saveState(); renderNav(); render(); showToast('已匯入備份資料');
      });
    }catch(err){
      showToast('讀取檔案失敗，請確認是正確的備份檔');
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   提醒排程（每分鐘檢查一次）
========================================================= */
function checkScheduledReminder(){
  if(!state.settings.reminderEnabled) return;
  var now = new Date();
  var hhmm = pad(now.getHours())+':'+pad(now.getMinutes());
  var todayStr = todayISO();
  if(hhmm===state.settings.reminderTime && state.settings.lastReminderDate!==todayStr){
    state.settings.lastReminderDate = todayStr;
    saveState();
    var msg = '該記錄今天的規劃內容囉！';
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('規劃小幫手', { body: msg });
    } else {
      showToast('🔔 '+msg);
    }
  }
}

/* =========================================================
   初始化 / 靜態事件綁定
========================================================= */
function bindStaticEvents(){
  document.addEventListener('pointermove', navPointerMove);
  document.addEventListener('pointerup', navPointerUp);
  document.addEventListener('pointercancel', navPointerCancel);
  document.addEventListener('pointermove', dashRowMove, {passive:false});
  document.addEventListener('pointerup', function(ev){ dashRowEnd(ev,false); });
  document.addEventListener('pointercancel', function(ev){ dashRowEnd(ev,true); });
  document.getElementById('brandBtn').addEventListener('click', function(){ switchView('dashboard'); });

  document.getElementById('btnAddTask').addEventListener('click', function(){
    var presetDate = ['day','week'].indexOf(currentView)!==-1 ? toISODate(cursorDate) : todayISO();
    openTaskModal({ date: presetDate });
  });

  document.getElementById('periodPrev').addEventListener('click', function(){ navigatePeriod(-1); });
  document.getElementById('periodNext').addEventListener('click', function(){ navigatePeriod(1); });
  document.getElementById('periodToday').addEventListener('click', function(){ cursorDate = new Date(); render(); });

  document.getElementById('closeTaskModal').addEventListener('click', closeTaskModal);
  document.getElementById('cancelTaskModal').addEventListener('click', closeTaskModal);
  document.getElementById('taskModalOverlay').addEventListener('click', function(e){
    if(e.target.id==='taskModalOverlay') closeTaskModal();
  });
  document.getElementById('taskForm').addEventListener('submit', saveTaskFromForm);
  document.getElementById('fAllDay').addEventListener('change', updateTaskFormVisibility);
  document.getElementById('fRepeat').addEventListener('change', updateTaskFormVisibility);
  document.getElementById('fWeekdays').addEventListener('click', function(e){
    var span = e.target.closest('span');
    if(span) span.classList.toggle('selected');
  });
  document.getElementById('btnDeleteTask').addEventListener('click', function(){
    var id = document.getElementById('taskId').value;
    var occ = editingOccDate;
    requestDelete(id, occ, function(){ closeTaskModal(); });
  });

  document.getElementById('btnNewCategory').addEventListener('click', function(){
    document.getElementById('newCategoryBox').classList.toggle('hidden');
  });
  var newCatColorBox = document.getElementById('fNewCatColor');
  newCatColorBox.addEventListener('change', function(e){
    if(e.target.id!=='fNewCatColorSelect') return;
    var preview = document.getElementById('fNewCatColorPreview');
    if(preview) preview.style.background = colorBase(e.target.value);
  });
  document.getElementById('btnConfirmNewCat').addEventListener('click', function(){
    var name = document.getElementById('fNewCatName').value.trim();
    if(!name){ showToast('請輸入分類名稱'); return; }
    var select = document.getElementById('fNewCatColorSelect');
    var color = select ? select.value : COLOR_KEYS[0];
    var newCat = { id:'cat'+Date.now(), name:name, color:color };
    state.categories.push(newCat);
    saveState();
    populateCategorySelect();
    document.getElementById('fCategory').value = newCat.id;
    document.getElementById('fNewCatName').value = '';
    document.getElementById('newCategoryBox').classList.add('hidden');
    showToast('已新增分類');
  });

  document.getElementById('closeOutline').addEventListener('click', closeDayOutline);
  document.getElementById('outlineClose2').addEventListener('click', closeDayOutline);
  document.getElementById('outlineOverlay').addEventListener('click', function(e){
    if(e.target.id==='outlineOverlay') closeDayOutline();
  });
  document.getElementById('outlineGotoDay').addEventListener('click', function(){
    var ds = outlineDate;
    closeDayOutline();
    if(ds){ cursorDate = parseISODate(ds); switchView('day'); }
  });

  document.getElementById('repeatDelOne').addEventListener('click', function(){
    var c = repeatDelCtx; closeRepeatDel();
    if(c){ if(c.after) c.after(); deleteOneOccurrence(c.id, c.date); }
  });
  document.getElementById('repeatDelFuture').addEventListener('click', function(){
    var c = repeatDelCtx; closeRepeatDel();
    if(!c) return;
    if(c.after) c.after();
    deleteFromDate(c.id, c.date);
  });
  document.getElementById('repeatDelCancel').addEventListener('click', closeRepeatDel);
  document.getElementById('repeatDelOverlay').addEventListener('click', function(e){
    if(e.target.id==='repeatDelOverlay') closeRepeatDel();
  });

  document.getElementById('undoBtn').addEventListener('click', doUndo);

  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
  document.getElementById('confirmOk').addEventListener('click', function(){
    var cb = confirmCallback;
    closeConfirm();
    if(cb) cb();
  });
  document.getElementById('confirmOverlay').addEventListener('click', function(e){
    if(e.target.id==='confirmOverlay') closeConfirm();
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  });

  window.addEventListener('resize', function(){
    if(currentView==='day') render();
  });
}

function init(){
  loadState();
  renderNav();
  bindStaticEvents();
  switchView('dashboard');
  setInterval(checkScheduledReminder, 30000);
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
