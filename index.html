<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>規劃小幫手｜自媒體行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8; --soft-sage:#C3D3C4;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --line:#E7E2DA; --white:#FFFFFF;
  --hour-h: 60px;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 2px 10px rgba(55,53,47,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:var(--dark);
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{font-family:inherit; font-size:14px; color:inherit;}
button{cursor:pointer;}
.hidden{display:none !important;}
.req{color:var(--pink);}
.hint{color:var(--gray); font-weight:400; font-size:12.5px;}

/* ---------- layout ---------- */
.app{display:flex; flex-direction:column; min-height:100vh;}
.brand-btn{
  background:none; border:none; font-weight:700; font-size:15.5px; color:var(--dark);
  letter-spacing:.3px; padding:8px 10px; border-radius:10px; flex-shrink:0;
}
.brand-btn:hover{background:var(--light-pink);}
.topnav{
  display:flex; gap:6px; padding:10px 26px; background:var(--cream);
  border-bottom:1px solid var(--line); overflow-x:auto; position:sticky; top:0; z-index:21;
}
.topnav::-webkit-scrollbar{height:5px;}
.nav-item{
  text-align:center; background:none; border:none; padding:9px 15px; white-space:nowrap; flex-shrink:0;
  border-radius:999px; font-size:14px; color:var(--medium); cursor:grab;
  font-weight:500; transition:background .15s, color .15s;
}
.nav-item:hover{background:var(--light-pink);}
.nav-item.active{background:var(--soft-pink); color:var(--dark); font-weight:700;}
.nav-item.dragging{background:var(--soft-blue); color:var(--dark); cursor:grabbing; opacity:.85;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:12px; padding:16px 26px;
  border-bottom:1px solid var(--line); background:var(--bg);
  position:sticky; top:0; z-index:20;
}
#pageTitle{font-size:19px; font-weight:700; margin:0; flex:1;}
.period-nav{display:flex; align-items:center; gap:6px; margin-right:8px;}
.period-nav button{background:var(--light-pink); border:none; width:30px; height:30px; border-radius:8px; color:var(--dark); font-size:14px;}
.period-nav .period-label{font-weight:700; font-size:14.5px; min-width:96px; text-align:center;}
.period-nav .today-btn{width:auto; padding:0 10px; background:var(--light-blue);}

.content{padding:22px 26px 60px; flex:1;}
.storage-note{padding:14px 26px 84px; text-align:center; font-size:12px; color:var(--gray); border-top:1px solid var(--line);}

/* ---------- buttons ---------- */
.btn{border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:14px; transition:opacity .15s, transform .1s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--pink); color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-ghost{background:var(--light-blue); color:var(--dark);}
.btn-ghost:hover{opacity:.85;}
.btn-danger{background:#fff; color:var(--pink); border:1.5px solid var(--soft-pink);}
.btn-danger:hover{background:var(--light-pink);}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.icon-btn{background:none; border:none; font-size:16px; color:var(--medium); padding:6px; border-radius:8px;}
.icon-btn:hover{background:var(--light-pink);}

/* ---------- reminder banner ---------- */
.reminder-banner{
  margin:16px 26px 0; padding:13px 18px; background:var(--light-sage);
  border:1px solid var(--soft-sage); border-radius:var(--radius-sm);
  display:flex; align-items:center; gap:12px; font-size:13.5px; color:var(--dark);
}
.reminder-banner .rb-actions{margin-left:auto; display:flex; gap:8px; flex-shrink:0;}

/* ---------- cards / dashboard ---------- */
.card-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
.stat-card{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow); border-left:4px solid var(--pink);
}
.stat-card.c-blue{border-left-color:var(--blue);}
.stat-card.c-sage{border-left-color:var(--sage);}
.stat-card .num{font-size:28px; font-weight:900; line-height:1.1;}
.stat-card .lbl{font-size:12.5px; color:var(--gray); margin-top:5px; font-weight:500;}
.dash-section{margin-bottom:28px;}
.dash-section h3{font-size:15px; margin:0 0 12px; font-weight:700;}
.empty-hint{
  background:var(--light-pink); border:1px dashed var(--soft-pink); border-radius:var(--radius-sm);
  padding:26px; text-align:center; color:var(--medium); font-size:13.5px;
}

/* ---------- category chips ---------- */
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700;}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0;}

/* ---------- list view ---------- */
.filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
.filter-bar input[type=text], .filter-bar select{
  padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--white);
}
.filter-bar input[type=text]{flex:1; min-width:160px;}
.range-btns{display:flex; gap:6px;}
.range-btns button{padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--white); font-size:12.5px; font-weight:600; color:var(--medium);}
.range-btns button.active{background:var(--soft-pink); border-color:var(--soft-pink); color:var(--dark);}
.list-table-wrap{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
table.list-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.list-table th{
  text-align:left; padding:12px 14px; background:var(--light-pink); color:var(--dark);
  font-weight:700; font-size:12.5px; white-space:nowrap;
}
table.list-table td{padding:12px 14px; border-top:1px solid var(--line); vertical-align:top;}
table.list-table tr:hover td{background:var(--light-blue);}
.td-title{font-weight:700;}
.td-desc{color:var(--gray); font-size:12.5px; max-width:220px;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.row-actions button{padding:5px 9px; font-size:11.5px; border-radius:7px; border:1px solid var(--line); background:var(--white); font-weight:600;}
.row-actions button:hover{background:var(--light-sage);}
.done-check{width:16px; height:16px; accent-color:var(--sage);}
.strike{text-decoration:line-through; color:var(--gray);}
.drag-handle{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; color:var(--gray); font-size:17px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;}
.drag-handle:hover{background:var(--light-pink); color:var(--dark);}
.lock-mark{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; color:var(--line); font-size:12px;}
tr.row-dragging td{background:var(--soft-blue) !important;}
tr.row-dragging{opacity:.92;}
tr.row-armed .drag-handle{background:var(--soft-pink); color:var(--dark);}
.inline-check{display:flex; align-items:flex-start; gap:6px;}
.inline-check .done-check{flex-shrink:0; width:17px; height:17px; margin:0; cursor:pointer;}
.inline-check .ic-text{flex:1; min-width:0;}
.day-block .done-check{position:absolute; top:6px; left:7px; width:17px; height:17px; margin:0; cursor:pointer; z-index:3;}
.day-block.has-check{padding-left:30px;}

/* ---------- calendar (month) ---------- */
.cal-grid{display:grid; grid-template-columns:38px repeat(7,minmax(0,1fr)); gap:8px;}
.cal-wk-corner{}
.cal-wk-label{text-align:center; font-size:12px; font-weight:700; color:var(--gray); padding-bottom:4px;}
.cal-week-num{
  display:flex; align-items:center; justify-content:center; writing-mode:vertical-rl;
  font-size:10.5px; font-weight:700; color:var(--medium); background:var(--light-blue);
  border-radius:9px; cursor:pointer; transition:background .12s, color .12s;
}
.cal-week-num:hover{background:var(--soft-blue);}
.cal-week-num.week-linked{background:var(--blue); color:#fff;}
.cal-cell{
  background:var(--white); border:1px solid var(--line); border-radius:10px; min-height:104px;
  padding:8px; display:flex; flex-direction:column; gap:4px; transition:box-shadow .12s, background .12s;
}
.cal-cell.other-month{opacity:.35;}
.cal-cell.is-today{border-color:var(--pink); border-width:1.5px;}
.cal-cell.week-linked{background:var(--light-blue);}
.cal-date-num{
  font-size:12.5px; font-weight:700; color:var(--medium); cursor:pointer; align-self:flex-start;
  padding:2px 7px; border-radius:7px; transition:background .12s, color .12s;
}
.cal-date-num:hover{background:var(--soft-pink); color:var(--dark);}
.cal-cell.is-today .cal-date-num{color:var(--pink);}
.cal-task-chip{
  font-size:10.5px; padding:2px 6px; border-radius:6px; font-weight:700; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.cal-more{font-size:10px; color:var(--medium); font-weight:700; cursor:pointer; padding:2px 6px; border-radius:6px; background:var(--light-blue); align-self:flex-start;}
.cal-more:hover{background:var(--soft-blue);}
.outline-list{list-style:none; margin:0 0 4px; padding:0; display:flex; flex-direction:column; gap:2px;}
.outline-list li{display:flex; align-items:baseline; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--line); font-size:14px;}
.outline-list li:last-child{border-bottom:none;}
.outline-list .ol-time{flex-shrink:0; width:92px; font-size:12px; color:var(--gray); font-weight:600;}
.outline-list .ol-title{flex:1; min-width:0; font-weight:700; word-break:break-word;}
.outline-list .ol-done{font-size:11px; color:var(--sage); font-weight:700; flex-shrink:0;}

/* ---------- week view ---------- */
.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:10px;}
.week-grid.layout-grid43{grid-template-columns:repeat(4,1fr);}
.week-col{background:var(--white); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow);}
.week-col-head{padding:9px; text-align:center; border-bottom:1px solid var(--line); cursor:pointer; background:var(--light-pink);}
.week-col-head.is-today{background:var(--soft-pink);}
.week-col-head .wd{font-size:11px; color:var(--medium); font-weight:700;}
.week-col-head .wn{font-size:15px; font-weight:900;}
.week-col-body{padding:8px; display:flex; flex-direction:column; gap:6px; min-height:180px;}
.week-allday-tag{font-size:10.5px; padding:3px 6px; border-radius:6px; font-weight:700;}

/* 週計劃：筆記本 2 欄排列（仿照參考圖：2 欄 x 4 列，最後一格單獨在左欄） */
.week-grid.layout-notebook{
  grid-template-columns:repeat(2,1fr); gap:0;
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; box-shadow:var(--shadow);
}
.week-grid.layout-notebook .week-col{
  background:none; border-radius:0; box-shadow:none;
  border:none; border-right:1px dashed var(--line); border-bottom:1px dashed var(--line);
}
.week-grid.layout-notebook .week-col:nth-child(2n){ border-right:none; }
.week-grid.layout-notebook .week-col:last-child{ border-bottom:none; }
.week-grid.layout-notebook .week-col-head{
  background:none; border-bottom:none; text-align:left; padding:14px 16px 4px;
  display:flex; flex-direction:row-reverse; align-items:baseline; justify-content:flex-start; gap:8px;
}
.week-grid.layout-notebook .week-col-head .wn{font-size:22px; font-weight:900; color:var(--dark);}
.week-grid.layout-notebook .week-col-head.is-today .wn{color:var(--pink);}
.week-grid.layout-notebook .week-col-head .wd{font-size:12px; color:var(--gray); font-weight:600;}
.week-grid.layout-notebook .week-col-body{padding:4px 16px 18px; min-height:150px;}
.week-grid.layout-notebook .week-empty{display:none;}
.week-task{
  border-radius:8px; padding:6px 8px; font-size:11.5px; cursor:pointer; border-left:3px solid;
}
.week-task .wt-time{font-weight:700; font-size:10.5px; display:block; margin-bottom:1px;}
.week-empty{font-size:11px; color:var(--gray); text-align:center; padding:14px 0;}

/* ---------- year view ---------- */
.year-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.year-month{background:var(--white); border:1px solid var(--line); border-radius:12px; padding:12px; box-shadow:var(--shadow);}
.year-month h4{margin:0 0 8px; font-size:13.5px; font-weight:700; cursor:pointer;}
.year-month h4:hover{color:var(--pink);}
.ymini-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.ymini-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--medium); border-radius:4px; cursor:pointer; position:relative;}
.ymini-cell.other{opacity:.25; cursor:default;}
.ymini-cell.today{background:var(--soft-pink); font-weight:700;}
.ymini-dots{position:absolute; bottom:1px; display:flex; gap:1.5px;}
.ymini-dots span{width:3.5px; height:3.5px; border-radius:50%;}

.month-notes-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.month-note-card{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
}
.month-note-card h4{margin:0; font-size:14.5px; font-weight:700; color:var(--dark);}
.month-note-textarea{
  flex:1; min-height:120px; border:1px solid var(--line); border-radius:9px; padding:9px 10px;
  background:var(--bg); resize:vertical; font-family:inherit; font-size:13px; color:var(--dark);
}

/* ---------- day view / timeline ---------- */
.day-allday{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.day-allday .none{font-size:12.5px; color:var(--gray);}
.allday-chip{padding:6px 12px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px;}
.timeline-wrap{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow-x:auto;
}
.timeline{position:relative; display:flex;}
.tl-hours{width:52px; flex-shrink:0; border-right:1px solid var(--line);}
.tl-hour-label{
  height:var(--hour-h); box-sizing:border-box; font-size:11px; color:var(--gray);
  text-align:right; padding-right:8px; border-top:1px solid var(--line); position:relative; top:-6px;
}
.tl-hour-label:first-child{border-top:none;}
.tl-body{position:relative; flex:1; min-width:280px;}
.tl-hour-row{height:var(--hour-h); border-top:1px solid var(--line); box-sizing:border-box;}
.tl-hour-row:first-child{border-top:none;}
.day-block{
  position:absolute; left:8px; right:8px; border-radius:9px; padding:6px 8px;
  font-size:12px; overflow:hidden; cursor:grab; border-left:3px solid; touch-action:none;
  box-shadow:0 1px 3px rgba(0,0,0,.08); z-index:2;
}
.day-block.dragging{cursor:grabbing; z-index:10; box-shadow:0 5px 14px rgba(0,0,0,.18); opacity:.95;}
.day-block .db-line{
  font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; line-height:1.32; font-size:11.5px; padding-right:26px;
}
.day-block .db-time{font-size:10.5px; opacity:.8; display:block; margin-top:2px;}
.db-copy{position:absolute; top:4px; right:5px; background:rgba(255,255,255,.6); border:none; border-radius:5px; font-size:10px; padding:2px 4px;}

/* ---------- settings ---------- */
.settings-block{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);}
.settings-block h3{margin:0 0 12px; font-size:14.5px;}
.cat-manage-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line);}
.cat-manage-row:first-of-type{border-top:none;}
.cat-manage-row .cm-name{flex:1; font-weight:600; font-size:13.5px;}
.switch{position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; cursor:pointer; inset:0; background:var(--line); transition:.2s; border-radius:22px;}
.slider:before{position:absolute; content:""; height:16px; width:16px; left:3px; bottom:3px; background:white; transition:.2s; border-radius:50%;}
input:checked + .slider{background:var(--sage);}
input:checked + .slider:before{transform:translateX(18px);}
.settings-row{display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap;}
.settings-row label{font-size:13.5px; font-weight:600; min-width:120px;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(55,53,47,.4); display:flex; align-items:center;
  justify-content:center; z-index:100; padding:16px;
}
.modal{background:var(--white); border-radius:16px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:22px 24px 20px;}
.modal-sm{max-width:340px;}
.modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-header h2{font-size:17px; margin:0;}
.form-row{margin-bottom:14px;}
.form-row label{display:block; font-size:13px; font-weight:700; margin-bottom:6px; color:var(--medium);}
.form-row input[type=text], .form-row input[type=date], .form-row input[type=time], .form-row select, .form-row textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--bg);
}
.form-row textarea{resize:vertical;}
.checkbox-label{display:flex !important; align-items:center; gap:8px; font-weight:600 !important; cursor:pointer;}
.checkbox-label input{width:16px; height:16px; accent-color:var(--pink);}
.cat-row{display:flex; gap:8px;}
.cat-row select{flex:1;}
.new-cat-box{display:flex; gap:8px; align-items:center; margin-top:8px; padding:10px; background:var(--light-pink); border-radius:9px;}
.new-cat-box input{flex:1; padding:8px 10px; border:1px solid var(--soft-pink); border-radius:8px;}
.color-picker{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.color-select{flex:1; min-width:150px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg);}
.color-preview{width:26px; height:26px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px var(--line);}
.time-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.weekday-picker{display:flex; gap:6px; flex-wrap:wrap;}
.weekday-picker span{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--light-blue); font-size:12.5px; font-weight:700; cursor:pointer; user-select:none;
}
.weekday-picker span.selected{background:var(--blue); color:#fff;}
.modal-actions{display:flex; align-items:center; gap:10px; margin-top:18px;}
.modal-actions .spacer{flex:1;}
.modal-actions p{margin:0 0 4px; font-size:14px;}

/* toast */
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--dark); color:#fff; padding:10px 18px; border-radius:9px; font-size:13px; z-index:200;
  transition:opacity .2s, transform .2s; pointer-events:none;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#undoBar{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:210;
  display:flex; align-items:center; gap:12px; width:calc(100% - 32px); max-width:440px;
  background:var(--dark); color:#fff; padding:10px 10px 10px 16px; border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.18); font-size:13.5px; overflow:hidden;
}
#undoBar.hidden{display:none;}
#undoBar .ub-msg{flex:1; min-width:0; line-height:1.4;}
#undoBar .ub-sec{color:var(--soft-pink); font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums;}
#undoBtn{background:var(--soft-pink); color:var(--dark); border:none; border-radius:9px; padding:10px 16px; font-weight:900; font-size:14px; flex-shrink:0;}
#undoBar .ub-progress{position:absolute; left:0; bottom:0; height:3px; background:var(--soft-pink); width:100%;}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .card-grid{grid-template-columns:repeat(2,1fr);}
  .year-grid{grid-template-columns:repeat(2,1fr);}
  .month-notes-grid{grid-template-columns:repeat(2,1fr);}

<script>
(function(){
'use strict';

/* =========================================================
   常數 & 狀態
========================================================= */
var STORAGE_KEY = 'zjy_planner_data_v1';
var WEEKDAY_LABELS = ['日','一','二','三','四','五','六'];
var WEEKDAY_LABELS_MON = ['一','二','三','四','五','六','日'];
var linkedWeekStart = null; /* ISO date string: keeps 月曆／週曆 focus in sync */
var MONTH_LABELS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

var DEFAULT_CATEGORIES = [
  { id:'personal', name:'私人', color:'m9' },
  { id:'work', name:'工作', color:'m5' }
];

/* 12 個莫蘭迪色系（分類顏色可選，下拉式選單） */
var COLOR_PALETTE = {
  m1:  { base:'#B8B8B0', name:'霧灰' },
  m2:  { base:'#A9A9A2', name:'深霧灰' },
  m3:  { base:'#C8C3BE', name:'燕麥灰' },
  m4:  { base:'#A2B4C0', name:'霧藍' },
  m5:  { base:'#8EA3B0', name:'深霧藍' },
  m6:  { base:'#BDCDD6', name:'淺灰藍' },
  m7:  { base:'#D4B5B0', name:'淺豆沙' },
  m8:  { base:'#E0C8C0', name:'杏粉' },
  m9:  { base:'#C9A4A0', name:'豆沙紅' },
  m10: { base:'#A3B5A6', name:'鼠尾草綠' },
  m11: { base:'#8A9A8C', name:'深灰綠' },
  m12: { base:'#B5C4B1', name:'抹茶綠' }
};
var COLOR_KEYS = ['m1','m2','m3','m4','m5','m6','m7','m8','m9','m10','m11','m12'];
function paletteEntry(key){ return COLOR_PALETTE[key] || COLOR_PALETTE[COLOR_KEYS[0]]; }
function colorBase(key){ return paletteEntry(key).base; }
function colorName(key){ return paletteEntry(key).name; }
function lightenHex(hex, amount){
  hex = String(hex).replace('#','');
  var r = parseInt(hex.substring(0,2),16);
  var g = parseInt(hex.substring(2,4),16);
  var b = parseInt(hex.substring(4,6),16);
  r = Math.round(r + (255-r)*amount);
  g = Math.round(g + (255-g)*amount);
  b = Math.round(b + (255-b)*amount);
  return 'rgb('+r+','+g+','+b+')';
}
function colorLight(key){ return lightenHex(colorBase(key), 0.82); }
function buildColorSelectHTML(selectId, previewId, selectedKey){
  var html = '<select id="'+selectId+'" class="color-select">';
  COLOR_KEYS.forEach(function(key){
    html += '<option value="'+key+'" '+(key===selectedKey?'selected':'')+'>'+colorName(key)+'　'+COLOR_PALETTE[key].base+'</option>';
  });
  html += '</select>';
  html += '<span class="color-preview" id="'+previewId+'" style="background:'+colorBase(selectedKey)+';"></span>';
  return html;
}

var NAV_ITEMS = [
  { view:'dashboard', label:'儀表板' },
  { view:'list', label:'清單' },
  { view:'day', label:'日計劃' },
  { view:'week', label:'週計劃' },
  { view:'month', label:'月計劃' },
  { view:'year', label:'年計劃' },
  { view:'settings', label:'設定' }
];
var DEFAULT_NAV_ORDER = NAV_ITEMS.map(function(n){ return n.view; });
function normalizeNavOrder(order){
  var valid = DEFAULT_NAV_ORDER.slice();
  var result = (order||[]).filter(function(v){ return valid.indexOf(v)!==-1; });
  valid.forEach(function(v){ if(result.indexOf(v)===-1) result.push(v); });
  return result;
}

var state = {
  categories: [],
  tasks: [],
  completions: {},
  monthNotes: {},
  sortOrder: [],
  settings: { reminderEnabled:false, reminderTime:'20:00', lastReminderDate:null, navOrder: DEFAULT_NAV_ORDER.slice(), weekLayout:'scroll', yearViewMode:'full' }
};

var currentView = 'dashboard';
var cursorDate = new Date();
var editingTaskId = null;
var editingOccDate = null;
var confirmCallback = null;
var dragInfo = null;
var navDragState = null;

/* =========================================================
   儲存 / 讀取
========================================================= */
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      state.categories = parsed.categories && parsed.categories.length ? parsed.categories : DEFAULT_CATEGORIES.slice();
      state.tasks = parsed.tasks || [];
      state.completions = parsed.completions || {};
      state.monthNotes = parsed.monthNotes || {};
      state.sortOrder = parsed.sortOrder || [];
      state.settings = Object.assign({reminderEnabled:false, reminderTime:'20:00', lastReminderDate:null, navOrder:DEFAULT_NAV_ORDER.slice(), weekLayout:'scroll', yearViewMode:'full'}, parsed.settings || {});
      state.settings.navOrder = normalizeNavOrder(state.settings.navOrder);
    } else {
      state.categories = DEFAULT_CATEGORIES.slice();
      state.tasks = [];
      state.completions = {};
      state.monthNotes = {};
      state.sortOrder = [];
    }
  }catch(e){
    console.error('讀取資料失敗', e);
    state.categories = DEFAULT_CATEGORIES.slice();
    state.tasks = [];
    state.completions = {};
    state.monthNotes = {};
    state.sortOrder = [];
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* =========================================================
   日期工具
========================================================= */
function pad(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISODate(s){
  var parts = s.split('-').map(Number);
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function addDays(d,n){ var nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function addMonths(d,n){ var nd=new Date(d); nd.setMonth(nd.getMonth()+n); return nd; }
function addYears(d,n){ var nd=new Date(d); nd.setFullYear(nd.getFullYear()+n); return nd; }
function startOfWeek(d){ var nd=new Date(d); nd.setHours(0,0,0,0); var dow=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-dow); return nd; }
function weekOfMonthIndex(weekStartDate){
  var gridStart = startOfWeek(startOfMonth(weekStartDate));
  var diffDays = Math.round((weekStartDate-gridStart)/86400000);
  return Math.floor(diffDays/7)+1;
}
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function isSameDate(a,b){ return toISODate(a)===toISODate(b); }
function todayISO(){ return toISODate(new Date()); }
function minutesFromTime(t){ var p=(t||'00:00').split(':').map(Number); return p[0]*60+p[1]; }
function timeFromMinutes(min){
  min = ((min%1440)+1440)%1440;
  return pad(Math.floor(min/60))+':'+pad(min%60);
}
function fmtDateLabel(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtDateFull(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }

/* =========================================================
   分類
========================================================= */
function getCategory(id){
  var i;
  for(i=0;i<state.categories.length;i++){ if(state.categories[i].id===id) return state.categories[i]; }
  return state.categories[0] || {id:'',name:'未分類',color:'pink'};
}
function chipStyle(color){ return 'background:'+colorLight(color)+'; color:'+colorBase(color)+';'; }
function dotStyle(color){ return 'background:'+colorBase(color)+';'; }

/* =========================================================
   重複發生日期計算
========================================================= */
function taskOccursOnDate(task, dateObj){
  if(task.skipDates && task.skipDates.indexOf(toISODate(dateObj))!==-1) return false;
  var start = parseISODate(task.date);
  var dIso = toISODate(dateObj);   // 只比日期，不比時分（避免「結束那天」被當成已過）
  if(dIso < task.date) return false;
  if(task.endRepeat && dIso > task.endRepeat) return false;
  if(task.repeat==='none'){
    return isSameDate(dateObj, start);
  }
  if(task.repeat==='daily'){
    return true;
  }
  if(task.repeat==='weekly'){
    var wds = task.weekdays && task.weekdays.length ? task.weekdays : [start.getDay()];
    return wds.indexOf(dateObj.getDay())!==-1;
  }
  if(task.repeat==='monthly'){
    return dateObj.getDate()===start.getDate();
  }
  return false;
}
function getOccurrencesForDate(dateObj){
  var out = [];
  state.tasks.forEach(function(task){
    if(taskOccursOnDate(task, dateObj)){
      out.push(task);
    }
  });
  out.sort(function(a,b){
    if(a.allDay && !b.allDay) return -1;
    if(!a.allDay && b.allDay) return 1;
    return minutesFromTime(a.startTime)-minutesFromTime(b.startTime);
  });
  return out;
}
function countOccurrencesInRange(rangeStart, rangeEnd){
  var count=0, d=new Date(rangeStart);
  while(d<=rangeEnd){
    count += getOccurrencesForDate(d).length;
    d = addDays(d,1);
  }
  return count;
}
/* 儀表板「今天要做的事」排序：
   有時間的事照時間固定；沒填時間（全天）的事依使用者拖拉的位置排，
   sortMinute = 排在哪個時間之後（-1 = 最上面），同位置再依 sortOrder 先後。 */
function sortIndex(id){
  var i = state.sortOrder.indexOf(id);
  return i===-1 ? 100000 : i;
}
function getDashboardOrdered(dateObj){
  var occs = getOccurrencesForDate(dateObj).slice();
  function key(t){ return t.allDay ? (typeof t.sortMinute==='number' ? t.sortMinute : -1) : minutesFromTime(t.startTime); }
  occs.sort(function(a,b){
    var ka=key(a), kb=key(b);
    if(ka!==kb) return ka-kb;
    if(a.allDay!==b.allDay) return a.allDay ? 1 : -1;
    if(a.allDay) return sortIndex(a.id)-sortIndex(b.id);
    return 0;
  });
  return occs;
}
function isCompleted(taskId, dateStr){ return !!state.completions[taskId+'|'+dateStr]; }
function toggleCompleted(taskId, dateStr){
  var key = taskId+'|'+dateStr;
  if(state.completions[key]) delete state.completions[key];
  else state.completions[key]=true;
  saveState();
}

/* =========================================================
   Toast
========================================================= */
var toastTimer=null;
function showToast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
}

/* =========================================================
   複製內容
========================================================= */
function copyContent(text, btnLabelEl){
  if(!text){ showToast('這則任務沒有內容可複製'); return; }
  function done(){ showToast('已複製內容 ✓'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text); done();
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

/* =========================================================
   導覽 / 切換視圖
========================================================= */
var VIEW_TITLES = {};
NAV_ITEMS.forEach(function(n){ VIEW_TITLES[n.view] = n.label; });

/* =========================================================
   頂部選單：可拖曳排序
========================================================= */
function renderNav(){
  var navList = document.getElementById('navList');
  navList.innerHTML = '';
  state.settings.navOrder.forEach(function(viewKey){
    var item = NAV_ITEMS.filter(function(n){ return n.view===viewKey; })[0];
    if(!item) return;
    var btn = document.createElement('button');
    btn.className = 'nav-item'+(viewKey===currentView?' active':'');
    btn.setAttribute('data-view', viewKey);
    btn.textContent = item.label;
    navList.appendChild(btn);
  });
  bindNavItemPointerHandlers();
}

function bindNavItemPointerHandlers(){
  var items = document.querySelectorAll('#navList .nav-item');
  items.forEach(function(btn){
    btn.addEventListener('pointerdown', function(ev){
      if(ev.button!==undefined && ev.button!==0 && ev.pointerType==='mouse') return;
      var s = {
        btn: btn,
        pointerId: ev.pointerId,
        pointerType: ev.pointerType,
        startX: ev.clientX,
        startY: ev.clientY,
        moved: false,
        dragging: false,
        timer: null
      };
      navDragState = s;
      if(ev.pointerType==='touch' || ev.pointerType==='pen'){
        s.timer = setTimeout(function(){
          if(navDragState===s && !s.dragging){
            s.dragging = true;
            btn.classList.add('dragging');
            try{ btn.setPointerCapture(s.pointerId); }catch(e){}
          }
        }, 260);
      }
    });
  });
}

function navPointerMove(ev){
  var s = navDragState;
  if(!s || s.btn===undefined) return;
  if(ev.pointerId!==undefined && s.pointerId!==undefined && ev.pointerId!==s.pointerId) return;
  var dx = ev.clientX - s.startX, dy = ev.clientY - s.startY;
  if(!s.moved && Math.sqrt(dx*dx+dy*dy) > 6) s.moved = true;
  if(!s.dragging && s.moved && s.pointerType==='mouse'){
    s.dragging = true;
    s.btn.classList.add('dragging');
    try{ s.btn.setPointerCapture(s.pointerId); }catch(e){}
  }
  if(!s.dragging) return;
  ev.preventDefault();
  var navList = document.getElementById('navList');
  var items = Array.prototype.slice.call(navList.querySelectorAll('.nav-item'));
  var x = ev.clientX;
  var placed = false;
  for(var i=0;i<items.length;i++){
    var el = items[i];
    if(el===s.btn) continue;
    var rect = el.getBoundingClientRect();
    var centerX = rect.left + rect.width/2;
    if(x < centerX){
      if(el.previousElementSibling!==s.btn) navList.insertBefore(s.btn, el);
      placed = true;
      break;
    }
  }
  if(!placed && navList.lastElementChild!==s.btn) navList.appendChild(s.btn);
}

function navPointerUp(ev){
  var s = navDragState;
  if(!s) return;
  if(ev.pointerId!==undefined && s.pointerId!==undefined && ev.pointerId!==s.pointerId) return;
  navDragState = null;
  if(s.timer) clearTimeout(s.timer);
  s.btn.classList.remove('dragging');
  if(s.dragging){
    var navList = document.getElementById('navList');
    var order = Array.prototype.slice.call(navList.querySelectorAll('.nav-item')).map(function(el){ return el.getAttribute('data-view'); });
    state.settings.navOrder = normalizeNavOrder(order);
    saveState();
  } else if(!s.moved){
    switchView(s.btn.getAttribute('data-view'));
  }
}
function navPointerCancel(){
  if(!navDragState) return;
  if(navDragState.timer) clearTimeout(navDragState.timer);
  if(navDragState.btn) navDragState.btn.classList.remove('dragging');
  navDragState = null;
}

function switchView(view){
  currentView = view;
  document.getElementById('pageTitle').textContent = VIEW_TITLES[view] || '';
  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(btn){ btn.classList.toggle('active', btn.getAttribute('data-view')===view); });
  var showPeriodNav = ['day','week','month','year'].indexOf(view)!==-1;
  document.getElementById('periodNav').classList.toggle('hidden', !showPeriodNav);
  var activeBtn = document.querySelector('.nav-item[data-view="'+view+'"]');
  if(activeBtn && activeBtn.scrollIntoView){ activeBtn.scrollIntoView({block:'nearest', inline:'center'}); }
  render();
}

function periodLabelText(){
  if(currentView==='day') return fmtDateFull(cursorDate);
  if(currentView==='week'){
    var s = startOfWeek(cursorDate), e = addDays(s,6);
    return '第'+weekOfMonthIndex(s)+'週｜'+fmtDateLabel(s)+' - '+fmtDateLabel(e);
  }
  if(currentView==='month') return cursorDate.getFullYear()+'年 '+(cursorDate.getMonth()+1)+'月';
  if(currentView==='year') return cursorDate.getFullYear()+'年';
  return '';
}
function navigatePeriod(delta){
  if(currentView==='day') cursorDate = addDays(cursorDate, delta);
  else if(currentView==='week') cursorDate = addDays(cursorDate, delta*7);
  else if(currentView==='month') cursorDate = addMonths(cursorDate, delta);
  else if(currentView==='year') cursorDate = addYears(cursorDate, delta);
  render();
}

/* =========================================================
   主渲染
========================================================= */
function render(){
  if(currentView==='day' || currentView==='week'){
    linkedWeekStart = toISODate(startOfWeek(cursorDate));
  }
  document.getElementById('periodLabel').textContent = periodLabelText();
  var content = document.getElementById('content');
  if(currentView==='dashboard') content.innerHTML = renderDashboard();
  else if(currentView==='list') content.innerHTML = renderList();
  else if(currentView==='day') content.innerHTML = renderDay();
  else if(currentView==='week') content.innerHTML = renderWeek();
  else if(currentView==='month') content.innerHTML = renderMonth();
  else if(currentView==='year') content.innerHTML = renderYear();
  else if(currentView==='settings') content.innerHTML = renderSettings();
  bindDynamicEvents();
  renderReminderBanner();
}

/* ---------- 儀表板 ---------- */
function renderDashboard(){
  var today = new Date();
  var wkStart = startOfWeek(today), wkEnd = addDays(wkStart,6);
  var moStart = startOfMonth(today), moEnd = endOfMonth(today);

  var todayCount = getOccurrencesForDate(today).length;
  var weekCount = countOccurrencesInRange(wkStart, wkEnd);
  var monthCount = countOccurrencesInRange(moStart, moEnd);

  var weekDone=0, weekTotal=0, d=new Date(wkStart);
  while(d<=wkEnd){
    getOccurrencesForDate(d).forEach(function(t){
      weekTotal++;
      if(isCompleted(t.id, toISODate(d))) weekDone++;
    });
    d = addDays(d,1);
  }
  var rate = weekTotal? Math.round(weekDone/weekTotal*100) : 0;

  var html = '';
  html += '<div class="card-grid">';
  html += statCard(todayCount, '今日任務', 'pink');
  html += statCard(weekCount, '本週任務', 'blue');
  html += statCard(monthCount, '本月任務', 'sage');
  html += statCard(rate+'%', '本週完成率', 'pink');
  html += '</div>';

  html += '<div class="dash-section"><h3>今天要做的事</h3>';
  var todays = getDashboardOrdered(today);
  if(!todays.length){
    html += '<div class="empty-hint">今天還沒有安排任何規劃，按右上角「＋ 新增任務」開始規劃吧。</div>';
  } else {
    html += '<div class="list-table-wrap"><table class="list-table" id="dashTable"><thead><tr><th style="width:38px;"></th><th>分類</th><th>時間</th><th>主題</th><th>完成</th><th>操作</th></tr></thead><tbody id="dashBody">';
    todays.forEach(function(t){
      var cat = getCategory(t.categoryId);
      var timeTxt = t.allDay ? '全天' : (t.startTime+' - '+t.endTime);
      var done = isCompleted(t.id, todayISO());
      html += '<tr data-row-id="'+t.id+'" data-allday="'+(t.allDay?'1':'0')+'" data-start-min="'+(t.allDay?'':minutesFromTime(t.startTime))+'">';
      html += t.allDay ? '<td style="padding:6px 4px;"><span class="drag-handle" title="長按拖拉調整順序" aria-label="拖拉調整順序">≡</span></td>'
                       : '<td style="padding:6px 4px;"><span class="lock-mark" title="有時間的事依時間固定，不能拖拉">●</span></td>';
      html += '<td><span class="chip" style="'+chipStyle(cat.color)+'">'+escapeHtml(cat.name)+'</span></td>';
      html += '<td>'+timeTxt+'</td>';
      html += '<td class="td-title '+(done?'strike':'')+'">'+escapeHtml(t.title)+'</td>';
      html += '<td><input type="checkbox" class="done-check" data-toggle-done="'+t.id+'" data-date="'+todayISO()+'" '+(done?'checked':'')+'></td>';
      html += '<td class="row-actions"><button data-copy="'+t.id+'">複製內容</button><button data-edit="'+t.id+'" data-occ-date="'+todayISO()+'">編輯</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="hint" style="margin-top:8px; display:block;">按住左邊的 ≡ 拖拉，就能調整沒填時間的事的順序（手機請長按 ≡ 再拖）；有填時間的事固定照時間排。順序會自動記住。</p>';
  }
  html += '</div>';

  html += '<div class="dash-section"><h3>分類總覽</h3><div style="display:flex; gap:10px; flex-wrap:wrap;">';
  state.categories.forEach(function(c){
    var cnt = state.tasks.filter(function(t){ return t.categoryId===c.id; }).length;
    html += '<span class="chip" style="'+chipStyle(c.color)+'">'+escapeHtml(c.name)+'　'+cnt+' 項任務範本</span>';
  });
  html += '</div></div>';

  return html;
}
function statCard(num, label, variant){
  return '<div class="stat-card c-'+variant+'"><div class="num">'+num+'</div><div class="lbl">'+label+'</div></div>';
}

/* ---------- 清單 ---------- */
var listState = { range:'month', search:'', category:'all' };
function renderList(){
  var range = getListRange();
  var occs = [];
  var d = new Date(range.start);
  while(d<=range.end){
    getOccurrencesForDate(d).forEach(function(t){
      occs.push({ task:t, date:new Date(d) });
    });
    d = addDays(d,1);
  }
  // filter
  occs = occs.filter(function(o){
    var t=o.task;
    if(listState.category!=='all' && t.categoryId!==listState.category) return false;
    if(listState.search){
      var q = listState.search.toLowerCase();
      var hay = (t.title+' '+t.description+' '+t.content).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  occs.sort(function(a,b){
    var da = toISODate(a.date), db = toISODate(b.date);
    if(da!==db) return da<db?-1:1;
    return minutesFromTime(a.task.startTime)-minutesFromTime(b.task.startTime);
  });

  var html = '<div class="filter-bar">';
  html += '<input type="text" id="listSearch" placeholder="搜尋主題、描述或內容..." value="'+escapeAttr(listState.search)+'">';
  html += '<select id="listCategoryFilter"><option value="all">全部分類</option>';
  state.categories.forEach(function(c){
    html += '<option value="'+c.id+'" '+(listState.category===c.id?'selected':'')+'>'+escapeHtml(c.name)+'</option>';
  });
  html += '</select>';
  html += '<div class="range-btns">';
  [['week','本週'],['month','本月'],['next30','未來30天'],['all','全部（±90天）']].forEach(function(r){
    html += '<button data-range="'+r[0]+'" class="'+(listState.range===r[0]?'active':'')+'">'+r[1]+'</button>';
  });
  html += '</div></div>';

  if(!occs.length){
    html += '<div class="empty-hint">這個範圍內沒有符合的任務。</div>';
    return html;
  }

  html += '<div class="list-table-wrap"><table class="list-table"><thead><tr>';
  html += '<th>日期</th><th>分類</th><th>主題</th><th>時間</th><th>描述</th><th>完成</th><th>操作</th>';
  html += '</tr></thead><tbody>';
  occs.forEach(function(o){
    var t=o.task, cat=getCategory(t.categoryId), dateStr=toISODate(o.date);
    var timeTxt = t.allDay ? '全天' : (t.startTime+' - '+t.endTime);
    var done = isCompleted(t.id, dateStr);
    var repeatTag = t.repeat!=='none' ? ' <span class="hint">('+repeatLabel(t)+')</span>' : '';
    html += '<tr>';
    html += '<td>'+fmtDateLabel(o.date)+' 週'+WEEKDAY_LABELS[o.date.getDay()]+'</td>';
    html += '<td><span class="chip" style="'+chipStyle(cat.color)+'">'+escapeHtml(cat.name)+'</span></td>';
    html += '<td class="td-title '+(done?'strike':'')+'">'+escapeHtml(t.title)+repeatTag+'</td>';
    html += '<td>'+timeTxt+'</td>';
    html += '<td class="td-desc">'+escapeHtml(t.description||'—')+'</td>';
    html += '<td><input type="checkbox" class="done-check" data-toggle-done="'+t.id+'" data-date="'+dateStr+'" '+(done?'checked':'')+'></td>';
    html += '<td class="row-actions"><button data-copy="'+t.id+'">複製</button><button data-edit="'+t.id+'" data-occ-date="'+dateStr+'">編輯</button><button data-delete="'+t.id+'" data-occ-date="'+dateStr+'">刪除</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}
function getListRange(){
  var today = new Date();
  if(listState.range==='week'){ var s=startOfWeek(today); return {start:s, end:addDays(s,6)}; }
  if(listState.range==='month'){ return {start:startOfMonth(today), end:endOfMonth(today)}; }
  if(listState.range==='next30'){ return {start:today, end:addDays(today,30)}; }
  return {start:addDays(today,-90), end:addDays(today,90)};
}
function repeatLabel(t){
  if(t.repeat==='daily') return '每天重複';
  if(t.repeat==='weekly') return '每週'+(t.weekdays||[]).map(function(w){return WEEKDAY_LABELS[w];}).join('、')+'重複';
  if(t.repeat==='monthly') return '每月'+parseISODate(t.date).getDate()+'日重複';
  return '';
}

/* ---------- 日計劃 ---------- */
function getHourHeight(){ return window.innerWidth<=768 ? 50 : 60; }
function renderDay(){
  var occs = getOccurrencesForDate(cursorDate);
  var allDayTasks = occs.filter(function(t){ return t.allDay; });
  var timedTasks = occs.filter(function(t){ return !t.allDay; });
  var dateStr = toISODate(cursorDate);
  var hh = getHourHeight();

  var html = '<div class="day-allday">';
  if(!allDayTasks.length){
    html += '<span class="none">今天沒有全天任務</span>';
  } else {
    allDayTasks.forEach(function(t){
      var cat = getCategory(t.categoryId);
      var done = isCompleted(t.id, dateStr);
      html += '<div class="allday-chip" style="'+chipStyle(cat.color)+'" data-edit="'+t.id+'" data-occ-date="'+dateStr+'">'+
        '<input type="checkbox" class="done-check" data-toggle-done="'+t.id+'" data-date="'+dateStr+'" '+(done?'checked':'')+' aria-label="完成" style="margin:0;">'+
        '<span class="'+(done?'strike':'')+'">'+escapeHtml(cat.name)+'｜'+escapeHtml(t.title)+'</span></div>';
    });
  }
  html += '</div>';

  html += '<div class="timeline-wrap"><div class="timeline">';
  html += '<div class="tl-hours">';
  for(var h=0; h<24; h++){ html += '<div class="tl-hour-label">'+pad(h)+':00</div>'; }
  html += '</div>';
  html += '<div class="tl-body" id="tlBody" style="height:'+(24*hh)+'px;">';
  for(var h2=0; h2<24; h2++){ html += '<div class="tl-hour-row"></div>'; }
  timedTasks.forEach(function(t){
    var cat = getCategory(t.categoryId);
    var startMin = minutesFromTime(t.startTime);
    var endMin = minutesFromTime(t.endTime);
    if(endMin<=startMin) endMin = startMin+30;
    var top = startMin/60*hh;
    var height = Math.max((endMin-startMin)/60*hh, 34);
    var done = isCompleted(t.id, dateStr);
    var summaryLine = escapeHtml(cat.name)+'｜'+escapeHtml(t.title)+(t.description?'｜'+escapeHtml(t.description):'');
    html += '<div class="day-block has-check" style="top:'+top+'px; height:'+height+'px; border-left-color:'+colorBase(cat.color)+'; background:'+colorLight(cat.color)+'; color:'+colorBase(cat.color)+';" '+
      'data-task-id="'+t.id+'" data-duration="'+(endMin-startMin)+'">';
    html += '<input type="checkbox" class="done-check" data-toggle-done="'+t.id+'" data-date="'+dateStr+'" '+(done?'checked':'')+' aria-label="完成">';
    html += '<button class="db-copy" data-copy="'+t.id+'" title="複製內容">複製</button>';
    html += '<span class="db-line '+(done?'strike':'')+'" title="'+escapeAttr(summaryLine)+'">'+summaryLine+'</span>';
    html += '<span class="db-time">'+t.startTime+' - '+t.endTime+'</span>';
    html += '</div>';
  });
  html += '</div></div></div>';
  html += '<p class="hint" style="margin-top:10px; display:block;">顯示格式：分類｜主題｜描述。提示：拖曳時段方塊可調整時間；點擊方塊可編輯任務內容。重複任務調整時間會套用到整個重複系列。</p>';
  return html;
}

/* ---------- 週計劃 ---------- */
function renderWeek(){
  var layout = state.settings.weekLayout || 'scroll';
  var wkStart = startOfWeek(cursorDate);
  var html = '<div style="display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;">';
  html += '<span class="hint">排列方式：</span><div class="range-btns">';
  html += '<button data-week-layout="scroll" class="'+(layout==='scroll'?'active':'')+'">橫向排列（可滑動）</button>';
  html += '<button data-week-layout="grid43" class="'+(layout==='grid43'?'active':'')+'">四＋三排列</button>';
  html += '<button data-week-layout="notebook" class="'+(layout==='notebook'?'active':'')+'">筆記本 2欄</button>';
  html += '</div></div>';
  html += '<div class="week-grid '+(layout==='grid43'?'layout-grid43':layout==='notebook'?'layout-notebook':'')+'">';
  for(var i=0;i<7;i++){
    var d = addDays(wkStart,i);
    var dateStr = toISODate(d);
    var isToday = isSameDate(d, new Date());
    var occs = getOccurrencesForDate(d);
    html += '<div class="week-col">';
    html += '<div class="week-col-head '+(isToday?'is-today':'')+'" data-goto-day="'+dateStr+'">';
    html += '<div class="wd">週'+WEEKDAY_LABELS[d.getDay()]+'</div><div class="wn">'+d.getDate()+'</div>';
    html += '</div>';
    html += '<div class="week-col-body">';
    if(!occs.length){
      html += '<div class="week-empty">尚無規劃</div>';
    } else {
      occs.forEach(function(t){
        var cat = getCategory(t.categoryId);
        var done = isCompleted(t.id, dateStr);
        if(t.allDay){
          html += '<div class="week-allday-tag inline-check" style="'+chipStyle(cat.color)+'" data-edit="'+t.id+'" data-occ-date="'+dateStr+'">'+
            '<input type="checkbox" class="done-check" data-toggle-done="'+t.id+'" data-date="'+dateStr+'" '+(done?'checked':'')+' aria-label="完成">'+
            '<span class="ic-text '+(done?'strike':'')+'">'+escapeHtml(t.title)+'</span></div>';
        } else {
          html += '<div class="week-task inline-check" style="background:'+colorLight(cat.color)+'; border-left-color:'+colorBase(cat.color)+';" data-edit="'+t.id+'" data-occ-date="'+dateStr+'">';
          html += '<input type="checkbox" class="done-check" data-toggle-done="'+t.id+'" data-date="'+dateStr+'" '+(done?'checked':'')+' aria-label="完成">';
          html += '<span class="ic-text"><span class="wt-time">'+t.startTime+'</span><span class="'+(done?'strike':'')+'">'+escapeHtml(t.title)+'</span></span>';
          html += '</div>';
        }
      });
    }
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

/* ---------- 月計劃 ---------- */
function renderMonth(){
  var moStart = startOfMonth(cursorDate);
  var gridStart = startOfWeek(moStart);
  var today = new Date();
  if(linkedWeekStart===null) linkedWeekStart = toISODate(startOfWeek(today));

  var html = '<div class="cal-grid">';
  html += '<div class="cal-wk-corner"></div>';
  WEEKDAY_LABELS_MON.forEach(function(w){ html += '<div class="cal-wk-label">週'+w+'</div>'; });

  for(var r=0;r<6;r++){
    var wkStart = addDays(gridStart, r*7);
    var wkStartStr = toISODate(wkStart);
    var isLinked = (wkStartStr===linkedWeekStart);
    html += '<div class="cal-week-num '+(isLinked?'week-linked':'')+'" data-goto-week="'+wkStartStr+'" title="查看第'+weekOfMonthIndex(wkStart)+'週的週計劃">第'+weekOfMonthIndex(wkStart)+'週</div>';
    for(var c=0;c<7;c++){
      var d = addDays(wkStart, c);
      var inMonth = d.getMonth()===moStart.getMonth();
      var dateStr = toISODate(d);
      var occs = getDashboardOrdered(d);
      html += '<div class="cal-cell '+(inMonth?'':'other-month')+' '+(isSameDate(d,today)?'is-today':'')+' '+(isLinked?'week-linked':'')+'">';
      html += '<div class="cal-date-num" data-goto-day="'+dateStr+'">'+d.getDate()+'</div>';
      var shown = occs.slice(0,3);
      shown.forEach(function(t){
        var cat = getCategory(t.categoryId);
        var mDone = isCompleted(t.id, dateStr);
        html += '<div class="cal-task-chip'+(mDone?' strike':'')+'" style="'+chipStyle(cat.color)+(mDone?' text-decoration:line-through; opacity:.6;':'')+'" data-edit-stop="'+t.id+'" data-occ-date="'+dateStr+'">'+escapeHtml(t.title)+'</div>';
      });
      if(occs.length>3){ html += '<div class="cal-more" data-day-outline="'+dateStr+'" role="button" title="查看這天全部的規劃">+'+(occs.length-3)+' 項</div>'; }
      html += '</div>';
    }
  }
  html += '</div>';
  html += '<p class="hint" style="margin-top:10px; display:block;">提示：完成的事會劃一條線，要打勾請點「日期數字」進入當天日計劃；點左側「第N週」直接跳到該週的週計劃，月曆與週曆會保持同一週的焦點連動。</p>';
  return html;
}

/* ---------- 年計劃 ---------- */
function renderYear(){
  var mode = state.settings.yearViewMode || 'full';
  var html = '<div style="display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;">';
  html += '<span class="hint">顯示模式：</span><div class="range-btns">';
  html += '<button data-year-mode="full" class="'+(mode==='full'?'active':'')+'">12個月總覽</button>';
  html += '<button data-year-mode="notes" class="'+(mode==='notes'?'active':'')+'">月份筆記（不顯示日期）</button>';
  html += '</div></div>';
  html += mode==='notes' ? renderYearMonthNotes() : renderYearFull();
  return html;
}

function renderYearFull(){
  var year = cursorDate.getFullYear();
  var today = new Date();
  var html = '<div class="year-grid">';
  for(var m=0; m<12; m++){
    var monthStart = new Date(year, m, 1);
    var gridStart = startOfWeek(monthStart);
    html += '<div class="year-month"><h4 data-goto-month="'+m+'">'+MONTH_LABELS[m]+'</h4><div class="ymini-grid">';
    for(var i=0;i<42;i++){
      var d = addDays(gridStart, i);
      if(d.getMonth()!==m){
        html += '<div class="ymini-cell other">'+d.getDate()+'</div>';
        continue;
      }
      var dateStr = toISODate(d);
      var occs = getOccurrencesForDate(d);
      var colors = [];
      occs.forEach(function(t){
        var c = getCategory(t.categoryId).color;
        if(colors.indexOf(c)===-1) colors.push(c);
      });
      html += '<div class="ymini-cell '+(isSameDate(d,today)?'today':'')+'" data-goto-day="'+dateStr+'">';
      html += d.getDate();
      if(colors.length){
        html += '<div class="ymini-dots">';
        colors.slice(0,3).forEach(function(c){ html += '<span style="background:'+colorBase(c)+'"></span>'; });
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

function renderYearMonthNotes(){
  var year = cursorDate.getFullYear();
  var html = '<p class="hint" style="display:block; margin-bottom:14px;">只顯示月份，不顯示日期數字；每個月份可以直接寫下這個月想做的事，會自動儲存。</p>';
  html += '<div class="month-notes-grid">';
  for(var m=0; m<12; m++){
    var key = year+'-'+(m+1);
    var val = (state.monthNotes && state.monthNotes[key]) ? state.monthNotes[key] : '';
    html += '<div class="month-note-card">';
    html += '<h4>'+year+'年 '+MONTH_LABELS[m]+'</h4>';
    html += '<textarea class="month-note-textarea" data-month-note-key="'+key+'" placeholder="這個月想做的事...">'+escapeHtml(val)+'</textarea>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ---------- 設定 ---------- */
function renderSettings(){
  var html = '';
  html += '<div class="settings-block"><h3>分類管理</h3>';
  state.categories.forEach(function(c){
    html += '<div class="cat-manage-row">';

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function saveTaskFromForm(e){
  e.preventDefault();
  var id = document.getElementById('taskId').value || ('t'+Date.now()+Math.floor(Math.random()*1000));
  var weekdays = [];
  document.querySelectorAll('#fWeekdays span.selected').forEach(function(s){ weekdays.push(Number(s.getAttribute('data-day'))); });
  var task = {
    id: id,
    title: document.getElementById('fTitle').value.trim(),
    categoryId: document.getElementById('fCategory').value,
    description: document.getElementById('fDesc').value.trim(),
    date: document.getElementById('fDate').value,
    allDay: document.getElementById('fAllDay').checked,
    startTime: document.getElementById('fStartTime').value || '09:00',
    endTime: document.getElementById('fEndTime').value || '10:00',
    repeat: document.getElementById('fRepeat').value,
    weekdays: weekdays,
    endRepeat: document.getElementById('fEndRepeat').value || null,
    content: document.getElementById('fContent').value
  };
  if(!task.title){ showToast('請輸入主題'); return; }
  if(!task.date){ showToast('請選擇開始日期'); return; }

  var idx = state.tasks.findIndex(function(t){ return t.id===id; });
  if(idx===-1){
    task.sortMinute = -1;
    state.sortOrder = state.sortOrder.filter(function(x){ return x!==id; });
    state.sortOrder.unshift(id);
    state.tasks.push(task);
  } else {
    var prev = state.tasks[idx];
    if(prev.skipDates) task.skipDates = prev.skipDates.slice();
    if(task.allDay && prev.allDay && typeof prev.sortMinute==='number') task.sortMinute = prev.sortMinute;
    else if(task.allDay){
      task.sortMinute = -1;
      state.sortOrder = state.sortOrder.filter(function(x){ return x!==id; });
      state.sortOrder.unshift(id);
    }
    state.tasks[idx] = task;
  }
  saveState();
  closeTaskModal();
  render();
  showToast('已儲存任務');
}

/* ---------- 刪除後 15 秒復原 ---------- */
var UNDO_SECONDS = 15;
var undoState = null;
function cloneObj(o){ return JSON.parse(JSON.stringify(o)); }
function offerUndo(message, restoreFn){
  clearUndo();
  var bar = document.getElementById('undoBar');
  document.getElementById('undoMsg').textContent = message;
  var left = UNDO_SECONDS;
  document.getElementById('undoSec').textContent = left+' 秒';
  var prog = document.getElementById('undoProgress');
  prog.style.transition = 'none'; prog.style.width = '100%';
  void prog.offsetWidth;
  prog.style.transition = 'width '+UNDO_SECONDS+'s linear'; prog.style.width = '0%';
  bar.classList.remove('hidden');
  document.getElementById('toast').classList.remove('show');
  undoState = { restore: restoreFn, timer: setInterval(function(){
    left--;
    if(left<=0){ clearUndo(); return; }
    document.getElementById('undoSec').textContent = left+' 秒';
  }, 1000) };
}
function clearUndo(){
  if(undoState && undoState.timer) clearInterval(undoState.timer);
  undoState = null;
  var bar = document.getElementById('undoBar');
  if(bar) bar.classList.add('hidden');
}
function doUndo(){
  if(!undoState) return;
  var fn = undoState.restore;
  clearUndo();
  fn();
  saveState(); render();
  showToast('已復原 ✓');
}
function takeTaskSnapshot(id){
  var t = state.tasks.find(function(x){ return x.id===id; });
  var comps = {};
  Object.keys(state.completions).forEach(function(k){ if(k.indexOf(id+'|')===0) comps[k]=true; });
  return { task: t ? cloneObj(t) : null, taskIndex: state.tasks.indexOf(t), comps: comps, sortIndex: state.sortOrder.indexOf(id) };
}
function restoreTaskSnapshot(id, snap){
  if(!snap.task) return;
  var cur = state.tasks.findIndex(function(x){ return x.id===id; });
  if(cur===-1) state.tasks.splice(Math.min(Math.max(snap.taskIndex,0), state.tasks.length), 0, snap.task);
  else state.tasks[cur] = snap.task;
  Object.keys(snap.comps).forEach(function(k){ state.completions[k]=true; });
  if(snap.sortIndex!==-1 && state.sortOrder.indexOf(id)===-1){
    state.sortOrder.splice(Math.min(snap.sortIndex, state.sortOrder.length), 0, id);
  }
}

function deleteTaskById(id){
  var snap = takeTaskSnapshot(id);
  state.tasks = state.tasks.filter(function(t){ return t.id!==id; });
  state.sortOrder = state.sortOrder.filter(function(x){ return x!==id; });
  Object.keys(state.completions).forEach(function(k){
    if(k.indexOf(id+'|')===0) delete state.completions[k];
  });
  saveState();
  render();
  offerUndo('已刪除「'+(snap.task?snap.task.title:'')+'」', function(){ restoreTaskSnapshot(id, snap); });
}

  var t = state.tasks.find(function(x){ return x.id===id; });

    openConfirm('確定要刪除「'+t.title+'」嗎？', function(){ if(afterDelete) afterDelete(); deleteTaskById(id); });
    return;
  }
  var ds = occDate;
  if(!ds || !taskOccursOnDate(t, parseISODate(ds))){
    ds = taskOccursOnDate(t, new Date()) ? todayISO() : t.date;
  }
  var dObj = parseISODate(ds);
  var label = (ds===todayISO()) ? '今天' : fmtDateLabel(dObj);

  document.getElementById('repeatDelMsg').textContent = '刪除「'+t.title+'」';

function deleteOneOccurrence(id, ds){
  var t = state.tasks.find(function(x){ return x.id===id; });
  if(!t) return;
  var snap = takeTaskSnapshot(id);
  t.skipDates = (t.skipDates||[]).filter(function(x){ return x!==ds; });
  t.skipDates.push(ds);
  delete state.completions[id+'|'+ds];
  saveState(); render();
  offerUndo('已刪除 '+fmtDateLabel(parseISODate(ds))+' 的「'+t.title+'」', function(){ restoreTaskSnapshot(id, snap); });
}
function deleteFromDate(id, ds){
  var t = state.tasks.find(function(x){ return x.id===id; });
  if(!t) return;
  var snap = takeTaskSnapshot(id);
  // 這一天保留，從隔天起不再出現（重複到這天為止）
  if(!t.endRepeat || t.endRepeat>ds) t.endRepeat = ds;
  // 這天和以前的打勾紀錄都保留；隔天以後的清掉
  Object.keys(state.completions).forEach(function(k){
    if(k.indexOf(id+'|')===0 && k.slice(id.length+1)>ds) delete state.completions[k];
  });
  if(t.skipDates) t.skipDates = t.skipDates.filter(function(x){ return x<=ds; });
  saveState(); render();
  offerUndo('已刪除 '+fmtDateLabel(parseISODate(ds))+' 之後的「'+t.title+'」', function(){ restoreTaskSnapshot(id, snap); });
}
